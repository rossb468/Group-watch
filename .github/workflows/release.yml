# Builds a signed, notarized Group Watch.dmg.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   MACOS_CERT_P12        base64 of your "Developer ID Application" certificate (.p12)
#   MACOS_CERT_PASSWORD   the .p12's password
#   APPLE_TEAM_ID         your 10-character team ID
#   ASC_KEY_ID            App Store Connect API key ID (for notarization)
#   ASC_ISSUER_ID         App Store Connect issuer ID
#   ASC_KEY_P8            base64 of the API key's .p8 file
# and this repository variable:
#   GW_SIGNALING_URL      your deployed signaling server, e.g. https://groupwatch.you.workers.dev
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Import signing certificate
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate --spec App/project.yml

      - name: Archive
        shell: bash -o pipefail {0}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+ ]] || VERSION="0.0.0"
          xcodebuild archive \
            -project App/GroupWatch.xcodeproj -scheme GroupWatch -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/GroupWatch.xcarchive" \
            -skipMacroValidation -skipPackagePluginValidation \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            GW_SIGNALING_URL="${{ vars.GW_SIGNALING_URL }}" \
            -quiet
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GroupWatch.xcarchive" \
            -exportOptionsPlist App/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

      - name: Make DMG, notarize, staple
        env:
          ASC_KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          APP="$RUNNER_TEMP/export/Group Watch.app"
          mkdir -p "$RUNNER_TEMP/dmg"
          cp -R "$APP" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "Group Watch" -srcfolder "$RUNNER_TEMP/dmg" -ov -format ULFO "GroupWatch.dmg"
          codesign --sign "Developer ID Application" --timestamp "GroupWatch.dmg"
          echo "$ASC_KEY" | base64 --decode > "$RUNNER_TEMP/key.p8"
          xcrun notarytool submit "GroupWatch.dmg" --wait \
            --key "$RUNNER_TEMP/key.p8" --key-id "${{ secrets.ASC_KEY_ID }}" --issuer "${{ secrets.ASC_ISSUER_ID }}"
          rm "$RUNNER_TEMP/key.p8"
          xcrun stapler staple "GroupWatch.dmg"
          spctl --assess --type open --context context:primary-signature -v "GroupWatch.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: GroupWatch-dmg
          path: GroupWatch.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GroupWatch.dmg
